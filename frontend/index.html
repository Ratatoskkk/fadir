<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before first paint, so nobody sees the wrong theme flash. A stored override pins
      // the scheme; without one the page follows the system (src/theme.js owns the rest).
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("fadir.theme"); } catch (e) { /* site data blocked */ }
        if (saved !== "light" && saved !== "dark") saved = null;
        document.querySelector('meta[name="color-scheme"]').content = saved || "light dark";
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      })();
    </script>
    <style>
      /* Pre-paint background, before either interface's stylesheet arrives. */
      html { background: oklch(0.17 0.008 258); }
      html[data-theme="light"] { background: oklch(0.972 0.004 258); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
