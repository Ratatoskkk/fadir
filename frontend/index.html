<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>faðir — Portföy</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M3 17.5C7.5 17.5 10 13 13 9.5C15.5 6.5 18 5 21 5' stroke='%23839cb2' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M3 17.5C7.5 17.5 11 16 14.5 15C17.5 14.2 19.5 14 21 14' stroke='%23a892c4' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='3' cy='17.5' r='2.3' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so a light-theme user never sees a black flash.
      // Kept inline and tiny for that reason — a module import would be too late.
      (function () {
        try {
          var saved = localStorage.getItem("fadir.theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* private mode: the default in the markup stands */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
